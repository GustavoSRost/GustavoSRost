name: Deploy Pages

on:
  push:
    branches: [main]
  schedule: # every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir dist
          cp index.html dist/
          cp -r assets dist/

      # Snake Animation
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: GustavoSRost
          outputs: dist/github-contribution-grid-snake.svg

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
